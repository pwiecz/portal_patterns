name: Go

on:
  push:
    branches: [ "fltk" ]
  pull_request:
    branches: [ "fltk" ]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.26.x

    - name: Build
      working-directory: ${{github.workspace}}/cmdline
      run: go build -v ./...

    - name: Test
      working-directory: ${{github.workspace}}/lib
      run: go test -v ./...
